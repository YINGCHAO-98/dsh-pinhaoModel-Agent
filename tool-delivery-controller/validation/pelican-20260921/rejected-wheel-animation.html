<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  :root{
    /* ---- 统一动画时长/速度常量 ---- */
    --cycle-duration: 1.1s;      /* 踩踏一圈 */
    --wheel-duration: 0.55s;     /* 车轮一圈 */
    --bob-duration: 0.55s;       /* 身体起伏 */
    --wing-duration: 0.55s;      /* 翅膀扇动 */
    --bg-duration: 6s;           /* 背景滚动一轮 */
    --speed: 1;                  /* 速度倍率（JS 调速） */

    --sky-top: #bfe6f7;
    --sky-bottom: #eaf7ee;
    --sun: #ffe08a;
    --cloud: #ffffff;
    --hill-far: #a9d6b3;
    --hill-near: #8cc79a;
    --road: #6d6f7a;
    --road-line: #f7f3e3;
    --frame: #d9483b;
    --frame-dark: #a83228;
    --metal: #b9c1cc;
    --metal-dark: #7d8794;
    --tire: #2f3440;
    --pelican-body: #fdfdfb;
    --pelican-shade: #dfe4ea;
    --beak: #f5a623;
    --beak-dark: #d9860c;
    --pouch: #ffd27a;
    --eye: #23272f;
  }

  *{ box-sizing: border-box; }

  html,body{ height:100%; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #dff1fb 0%, #f4faf6 100%);
    color:#22303c;
  }

  h1{
    font-size: clamp(16px, 2.4vw, 22px);
    font-weight: 700;
    letter-spacing: .04em;
    margin:0;
    text-align:center;
  }

  .stage{
    width: min(960px, 100%);
    border-radius: 18px;
    overflow: hidden;
    background: var(--sky-bottom);
    box-shadow: 0 10px 30px rgba(34,48,60,.18);
    line-height: 0;
  }

  svg#scene{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio: 900 / 520;
  }

  .controls{
    width: min(960px, 100%);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px 18px;
    padding:12px 16px;
    border-radius: 14px;
    background: rgba(255,255,255,.82);
    box-shadow: 0 6px 18px rgba(34,48,60,.12);
  }

  .controls button{
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    padding: 9px 18px;
    min-width: 104px;
    border-radius: 999px;
    border: 2px solid #1f6f8b;
    background: #1f6f8b;
    color:#fff;
    cursor:pointer;
    transition: background-color .15s ease, color .15s ease, transform .1s ease;
  }

  .controls button:hover{ background:#2b87a8; border-color:#2b87a8; }
  .controls button:active{ transform: translateY(1px); }

  .controls button:focus-visible,
  .controls input[type="range"]:focus-visible,
  .controls input[type="number"]:focus-visible{
    outline: 3px solid #ff8c42;
    outline-offset: 3px;
  }

  .speed-group{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    font-weight:600;
  }

  .speed-group input[type="range"]{
    width: 190px;
    accent-color:#1f6f8b;
    cursor:pointer;
  }

  #speedValue{
    font-variant-numeric: tabular-nums;
    min-width: 3.2em;
    display:inline-block;
    color:#1f6f8b;
  }

  .hint{
    font-size:12.5px;
    color:#5b6b78;
    margin:0;
    text-align:center;
  }

  /* ---------------- 动画 ---------------- */
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  @keyframes bob {
    0%,100% { transform: translateY(0px); }
    50%     { transform: translateY(-5px); }
  }

  @keyframes wingFlap {
    0%,100% { transform: rotate(-4deg) scale(1); }
    50%     { transform: rotate(9deg) scale(1.03); }
  }

  @keyframes legPedal {
    0%,100% { transform: rotate(0deg); }
    50%     { transform: rotate(-16deg); }
  }

  @keyframes scrollLeft {
    from { transform: translateX(0); }
    to   { transform: translateX(-450px); }
  }

  @keyframes scrollLeftFar {
    from { transform: translateX(0); }
    to   { transform: translateX(-360px); }
  }

  /* 时长全部由自定义属性派生，方便调速 */
  #wheelRear, #wheelFront{
    animation: spin calc(var(--wheel-duration) / var(--speed)) linear infinite;
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }
  #crank{
    animation: spin calc(var(--cycle-duration) / var(--speed)) linear infinite;
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }
  #pedalLeg{
    animation: legPedal calc(var(--cycle-duration) / var(--speed)) ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 0% 0%;
  }
  #pedalLegBack{
    animation: legPedal calc(var(--cycle-duration) / var(--speed)) ease-in-out infinite reverse;
    transform-box: fill-box;
    transform-origin: 0% 0%;
  }
  #pelican{
    animation: bob calc(var(--bob-duration) / var(--speed)) ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 80%;
  }
  #wingNear{
    animation: wingFlap calc(var(--wing-duration) / var(--speed)) ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 20% 10%;
  }
  #cloudsFar{
    animation: scrollLeftFar calc(var(--bg-duration) / var(--speed)) linear infinite;
  }
  #cloudsNear{
    animation: scrollLeft calc(var(--bg-duration) / var(--speed) * 0.7) linear infinite;
  }
  #roadLines{
    animation: scrollLeft calc(var(--bg-duration) / var(--speed) * 0.32) linear infinite;
  }
  #hillsNear{
    animation: scrollLeftFar calc(var(--bg-duration) / var(--speed) * 1.6) linear infinite;
  }

  body.paused #wheelRear,
  body.paused #wheelFront,
  body.paused #crank,
  body.paused #pedalLeg,
  body.paused #pedalLegBack,
  body.paused #pelican,
  body.paused #wingNear,
  body.paused #cloudsFar,
  body.paused #cloudsNear,
  body.paused #roadLines,
  body.paused #hillsNear{
    animation-play-state: paused;
  }

  /* 尊重 prefers-reduced-motion：默认暂停运动 */
  @media (prefers-reduced-motion: reduce){
    #wheelRear, #wheelFront, #crank, #pedalLeg, #pedalLegBack,
    #pelican, #wingNear, #cloudsFar, #cloudsNear, #roadLines, #hillsNear{
      animation-play-state: paused;
    }
    body.motion-forced #wheelRear,
    body.motion-forced #wheelFront,
    body.motion-forced #crank,
    body.motion-forced #pedalLeg,
    body.motion-forced #pedalLegBack,
    body.motion-forced #pelican,
    body.motion-forced #wingNear,
    body.motion-forced #cloudsFar,
    body.motion-forced #cloudsNear,
    body.motion-forced #roadLines,
    body.motion-forced #hillsNear{
      animation-play-state: running;
    }
  }
</style>
</head>
<body>
  <h1>鹈鹕骑自行车 · Pelican on a Bicycle</h1>

  <div class="stage">
    <svg id="scene" viewBox="0 0 900 520" role="img" aria-labelledby="sceneTitle sceneDesc" preserveAspectRatio="xMidYMid meet">
      <title id="sceneTitle">一只鹈鹕骑着自行车向前行进</title>
      <desc id="sceneDesc">卡通风格的二维循环动画：白色鹈鹕有着长喙和下方明显的橙色喉囊，坐在红色自行车上不停踩踏，双轮与辐条持续旋转，身体随节奏上下起伏、翅膀轻扇，背景的云朵、山丘与道路标线横向滚动，营造前进感。</desc>

      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--sky-top)"/>
          <stop offset="100%" stop-color="var(--sky-bottom)"/>
        </linearGradient>
        <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff3c4"/>
          <stop offset="100%" stop-color="var(--sun)"/>
        </radialGradient>
        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7d808c"/>
          <stop offset="100%" stop-color="var(--road)"/>
        </linearGradient>
      </defs>

      <!-- ============ 背景层 ============ -->
      <rect x="0" y="0" width="900" height="520" fill="url(#skyGrad)"/>

      <circle cx="760" cy="86" r="46" fill="url(#sunGrad)" opacity="0.95"/>

      <!-- 远景云（横向循环滚动） -->
      <g id="cloudsFar" opacity="0.85">
        <g fill="var(--cloud)">
          <g transform="translate(40,70)">
            <ellipse cx="0" cy="0" rx="34" ry="18"/>
            <ellipse cx="30" cy="6" rx="26" ry="14"/>
            <ellipse cx="-26" cy="8" rx="22" ry="12"/>
          </g>
          <g transform="translate(410,52) scale(1.15)">
            <ellipse cx="0" cy="0" rx="30" ry="16"/>
            <ellipse cx="26" cy="6" rx="22" ry="12"/>
            <ellipse cx="-24" cy="7" rx="20" ry="11"/>
          </g>
        </g>
        <!-- 复制一份用于无缝衔接 -->
        <g fill="var(--cloud)" transform="translate(360,0)">
          <g transform="translate(40,70)">
            <ellipse cx="0" cy="0" rx="34" ry="18"/>
            <ellipse cx="30" cy="6" rx="26" ry="14"/>
            <ellipse cx="-26" cy="8" rx="22" ry="12"/>
          </g>
          <g transform="translate(410,52) scale(1.15)">
            <ellipse cx="0" cy="0" rx="30" ry="16"/>
            <ellipse cx="26" cy="6" rx="22" ry="12"/>
            <ellipse cx="-24" cy="7" rx="20" ry="11"/>
          </g>
        </g>
      </g>

      <!-- 近景云 -->
      <g id="cloudsNear" opacity="0.95">
        <g fill="var(--cloud)">
          <g transform="translate(180,150) scale(0.85)">
            <ellipse cx="0" cy="0" rx="40" ry="20"/>
            <ellipse cx="36" cy="7" rx="28" ry="15"/>
            <ellipse cx="-32" cy="9" rx="24" ry="13"/>
          </g>
        </g>
        <g fill="var(--cloud)" transform="translate(450,0)">
          <g transform="translate(180,150) scale(0.85)">
            <ellipse cx="0" cy="0" rx="40" ry="20"/>
            <ellipse cx="36" cy="7" rx="28" ry="15"/>
            <ellipse cx="-32" cy="9" rx="24" ry="13"/>
          </g>
        </g>
      </g>

      <!-- 远山 -->
      <path d="M0 350 L120 268 L220 340 L330 250 L450 350 L560 286 L690 352 L800 292 L900 356 L900 400 L0 400 Z"
            fill="var(--hill-far)" opacity="0.75"/>

      <!-- 近景山丘（滚动） -->
      <g id="hillsNear">
        <g fill="var(--hill-near)">
          <path d="M0 400 C 90 348, 180 348, 270 400 L270 420 L0 420 Z"/>
          <path d="M260 400 C 340 352, 430 352, 520 400 L520 420 L260 420 Z"/>
          <path d="M510 400 C 600 350, 690 350, 780 400 L780 420 L510 420 Z"/>
          <path d="M770 400 C 850 356, 900 356, 940 400 L940 420 L770 420 Z"/>
        </g>
        <g fill="var(--hill-near)" transform="translate(360,0)">
          <path d="M0 400 C 90 348, 180 348, 270 400 L270 420 L0 420 Z"/>
          <path d="M260 400 C 340 352, 430 352, 520 400 L520 420 L260 420 Z"/>
          <path d="M510 400 C 600 350, 690 350, 780 400 L780 420 L510 420 Z"/>
          <path d="M770 400 C 850 356, 900 356, 940 400 L940 420 L770 420 Z"/>
        </g>
      </g>

      <!-- 路面 -->
      <rect x="0" y="404" width="900" height="116" fill="url(#roadGrad)"/>
      <rect x="0" y="404" width="900" height="6" fill="#8d909c" opacity="0.7"/>

      <!-- 路面标线（横向循环滚动） -->
      <g id="roadLines" opacity="0.9">
        <g fill="var(--road-line)">
          <rect x="20" y="462" width="70" height="9" rx="4"/>
          <rect x="140" y="462" width="70" height="9" rx="4"/>
          <rect x="260" y="462" width="70" height="9" rx="4"/>
          <rect x="380" y="462" width="70" height="9" rx="4"/>
        </g>
        <g fill="var(--road-line)" transform="translate(450,0)">
          <rect x="20" y="462" width="70" height="9" rx="4"/>
          <rect x="140" y="462" width="70" height="9" rx="4"/>
          <rect x="260" y="462" width="70" height="9" rx="4"/>
          <rect x="380" y="462" width="70" height="9" rx="4"/>
        </g>
      </g>

      <!-- 背景小草丛（滚动装饰） -->
      <g id="grass" opacity="0.85">
        <g fill="#69b37c">
          <path d="M60 404 q6 -18 12 0 q6 -14 10 0 z"/>
          <path d="M300 404 q6 -18 12 0 q6 -14 10 0 z"/>
          <path d="M540 404 q6 -18 12 0 q6 -14 10 0 z"/>
          <path d="M780 404 q6 -18 12 0 q6 -14 10 0 z"/>
        </g>
      </g>

      <!-- ============ 主体：自行车 + 鹈鹕 ============ -->
      <g id="rig" transform="translate(210,120)">

        <!-- 影子 -->
        <ellipse cx="230" cy="292" rx="185" ry="14" fill="#3c4450" opacity="0.22"/>

        <!-- ---------- 车轮 ---------- -->
        <!-- 后轮 -->
        <g id="wheelRear" transform="translate(110,250)">
          <circle cx="0" cy="0" r="58" fill="none" stroke="var(--tire)" stroke-width="11"/>
          <circle cx="0" cy="0" r="50" fill="none" stroke="#e9edf2" stroke-width="4"/>
          <g stroke="var(--metal)" stroke-width="3" stroke-linecap="round">
            <line x1="0" y1="-48" x2="0" y2="48"/>
            <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(30)"/>
            <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(60)"/>
            <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(90)"/>
            <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(120)"/>
            <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(150)"/>
          </g>
          <circle cx="0" cy="0" r="8" fill="var(--metal-dark)"/>
          <circle cx="0" cy="0" r="3.5" fill="#f2f5f8"/>
        </g>

        <!-- 前轮 -->
        <g id="wheelFront" transform="translate(348,250)">
          <circle cx="0" cy="0" r="58" fill="none" stroke="var(--tire)" stroke-width="11"/>
          <circle cx="0" cy="0" r="50" fill="none" stroke="#e9edf2" stroke-width="4"/>
          <g stroke="var(--metal)" stroke-width="3" stroke-linecap="round">
            <line x1="0" y1="-48" x2="0" y2="48"/>
            <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(30)"/>
            <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(60)"/>
            <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(90)"/>
            <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(120)"/>
            <line x1="0" y1="-48" x2="0" y2="48" transform="rotate(150)"/>
          </g>
          <circle cx="0" cy="0" r="8" fill="var(--metal-dark)"/>
          <circle cx="0" cy="0" r="3.5" fill="#f2f5f8"/>
        </g>

        <!-- ---------- 车架 ---------- -->
        <g stroke="var(--frame)" stroke-width="9" stroke-linecap="round" fill="none">
          <line x1="110" y1="250" x2="230" y2="252"/>   <!-- 后下叉 -->
          <line x1="110" y1="250" x2="186" y2="176"/>   <!-- 后上叉 -->
          <line x1="186" y1="176" x2="230" y2="252"/>   <!-- 座管 -->
          <line x1="230" y1="252" x2="300" y2="180"/>   <!-- 下管 -->
          <line x1="186" y1="176" x2="300" y2="180"/>   <!-- 上管 -->
          <line x1="300" y1="180" x2="348" y2="250"/>   <!-- 前叉 -->
        </g>
        <g stroke="var(--frame-dark)" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.55">
          <line x1="230" y1="252" x2="230" y2="258"/>
        </g>

        <!-- 鞍座 -->
        <path d="M158 166 q30 -14 62 -2 q-8 16 -32 16 q-22 0 -30 -14 z" fill="#3a3f4b"/>
        <rect x="184" y="168" width="10" height="10" rx="3" fill="var(--metal-dark)"/>

        <!-- 车把 -->
        <g stroke="var(--metal-dark)" stroke-width="8" stroke-linecap="round" fill="none">
          <line x1="300" y1="180" x2="292" y2="140"/>
          <line x1="268" y1="136" x2="318" y2="144"/>
        </g>
        <circle cx="268" cy="136" r="7" fill="#2f3440"/>
        <circle cx="318" cy="144" r="7" fill="#2f3440"/>
        <!-- 车把 --> 
        <circle cx="300" cy="180" r="6" fill="var(--metal-dark)"/>

        <!-- ---------- 中轴 / 曲柄 / 踏板 ---------- -->
        <circle cx="230" cy="252" r="14" fill="var(--metal)" stroke="var(--metal-dark)" stroke-width="3"/>
        <!-- 牙盘 -->
        <circle cx="230" cy="252" r="26" fill="none" stroke="var(--metal-dark)" stroke-width="4" opacity="0.75"/>
        <circle cx="230" cy="252" r="30" fill="none" stroke="var(--metal)" stroke-width="2" stroke-dasharray="4 6" opacity="0.8"/>

        <g id="crank">
          <line x1="230" y1="252" x2="230" y2="206" stroke="#4a5160" stroke-width="8" stroke-linecap="round"/>
          <line x1="230" y1="252" x2="230" y2="298" stroke="#4a5160" stroke-width="8" stroke-linecap="round"/>
          <rect x="216" y="198" width="28" height="10" rx="4" fill="#2f3440"/>
          <rect x="216" y="296" width="28" height="10" rx="4" fill="#2f3440"/>
        </g>

        <!-- ---------- 远侧腿（后） ---------- -->
        <g id="pedalLegBack">
          <path d="M212 190 L196 226 L214 252" stroke="#e6a91f" stroke-width="13" stroke-linecap="round" fill="none"/>
          <path d="M214 252 L228 268" stroke="#e6a91f" stroke-width="12" stroke-linecap="round" fill="none"/>
          <path d="M222 268 q16 -4 24 6" stroke="var(--beak-dark)" stroke-width="8" stroke-linecap="round" fill="none"/>
        </g>

        <!-- ---------- 鹈鹕 ---------- -->
        <g id="pelican">
          <!-- 尾羽 -->
          <path d="M150 176 q-34 -12 -50 6 q26 10 50 6 z" fill="var(--pelican-shade)"/>

          <!-- 身体 -->
          <ellipse cx="206" cy="180" rx="62" ry="48" fill="var(--pelican-body)"/>
          <path d="M150 190 q30 40 96 22 q-24 30 -62 26 q-32 -4 -34 -48 z" fill="var(--pelican-shade)" opacity="0.85"/>

          <!-- 脖子 -->
          <path d="M246 168 q22 -46 6 -78 q-8 -18 -30 -14 q-16 4 -14 20 q2 12 14 14 q10 2 12 -8"
                stroke="var(--pelican-body)" stroke-width="34" fill="none" stroke-linecap="round"/>

          <!-- 头 -->
          <circle cx="238" cy="70" r="30" fill="var(--pelican-body)"/>
          <path d="M226 46 q22 -10 34 8" stroke="var(--pelican-shade)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>

          <!-- 眼睛 -->
          <circle cx="248" cy="64" r="7.5" fill="var(--eye)"/>
          <circle cx="250.5" cy="61.5" r="2.6" fill="#ffffff"/>

          <!-- 上喙 -->
          <path d="M262 60 L348 74 L262 86 Z" fill="var(--beak)"/>
          <path d="M262 60 L348 74 L306 76 Z" fill="#ffc65c" opacity="0.85"/>
          <!-- 喙尖小钩 -->
          <path d="M344 72 q10 6 2 12 q-6 -2 -6 -8 z" fill="var(--beak-dark)"/>

          <!-- 喉囊（下方明显） -->
          <path d="M262 86 q4 40 42 44 q30 3 44 -44 q-42 12 -86 0 z" fill="var(--pouch)"/>
          <path d="M266 92 q6 30 38 34 q24 3 38 -34" stroke="var(--beak-dark)" stroke-width="2.5" fill="none" opacity="0.55"/>

          <!-- 远侧翅膀（后） -->
          <path d="M196 150 q-52 4 -74 34 q30 26 76 6 z" fill="var(--pelican-shade)"/>

          <!-- 近侧翅膀（扇动） -->
          <g id="wingNear">
            <path d="M204 144 q-64 2 -90 40 q40 34 96 8 q-10 -22 -6 -48 z" fill="#f2f4f7" stroke="var(--pelican-shade)" stroke-width="3"/>
            <path d="M186 168 q-40 6 -62 26" stroke="var(--pelican-shade)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M180 182 q-34 6 -52 22" stroke="var(--pelican-shade)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          </g>
        </g>

        <!-- ---------- 近侧腿（前，踩踏） ---------- -->
        <g id="pedalLeg">
          <!-- 大腿 -->
          <path d="M226 196 L246 232 L232 262" stroke="var(--beak)" stroke-width="15" stroke-linecap="round" fill="none"/>
          <!-- 小腿 -->
          <path d="M232 262 L232 292" stroke="var(--beak)" stroke-width="13" stroke-linecap="round" fill="none"/>
          <!-- 膝盖高光 -->
          <circle cx="246" cy="232" r="8" fill="#ffc65c"/>
          <!-- 脚掌 -->
          <path d="M226 296 q18 -6 30 6" stroke="var(--beak-dark)" stroke-width="9" stroke-linecap="round" fill="none"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="controls">
    <button id="toggleBtn" type="button" aria-pressed="false">暂停</button>
    <div class="speed-group">
      <label for="speedRange">速度</label>
      <input id="speedRange" type="range" min="0.25" max="2.5" step="0.05" value="1"
             aria-describedby="speedValue" />
      <output id="speedValue" for="speedRange">1.00×</output>
    </div>
    <p class="hint" id="motionNote">空格键可暂停 / 继续；若系统开启「减弱动态效果」，动画默认暂停。</p>
  </div>

<script>
(function () {
  'use strict';

  var root = document.documentElement;
  var body = document.body;
  var toggleBtn = document.getElementById('toggleBtn');
  var speedRange = document.getElementById('speedRange');
  var speedValue = document.getElementById('speedValue');

  var prefersReduced = false;
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    prefersReduced = mq.matches;
    var onChange = function (e) {
      prefersReduced = e.matches;
      if (prefersReduced && !paused) {
        setPaused(true);
      }
    };
    if (typeof mq.addEventListener === 'function') {
      mq.addEventListener('change', onChange);
    } else if (typeof mq.addListener === 'function') {
      mq.addListener(onChange);
    }
  }

  // 初始状态：尊重 prefers-reduced-motion
  var paused = prefersReduced;

  function applySpeed(value) {
    var v = Number(value);
    if (!isFinite(v) || v <= 0) { v = 1; }
    v = Math.min(2.5, Math.max(0.25, v));
    root.style.setProperty('--speed', String(v));
    speedValue.textContent = v.toFixed(2) + '\u00D7';
    return v;
  }

  function setPaused(next) {
    paused = !!next;
    body.classList.toggle('paused', paused);
    // 用户主动播放时，覆盖 reduced-motion 的默认暂停
    body.classList.toggle('motion-forced', !paused);
    toggleBtn.textContent = paused ? '继续' : '暂停';
    toggleBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
  }

  toggleBtn.addEventListener('click', function () {
    setPaused(!paused);
  });

  speedRange.addEventListener('input', function () {
    applySpeed(speedRange.value);
  });

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar') {
      var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
      if (tag === 'input' || tag === 'textarea' || tag === 'button') { return; }
      e.preventDefault();
      setPaused(!paused);
    }
  });

  applySpeed(speedRange.value);
  setPaused(paused);
})();
</script>
</body>
</html>
