<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Riding a Bicycle</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow-x: hidden;
    background: linear-gradient(#bfe9f7 0%, #e9f7fd 70%, #d3eec9 100%);
    font-family: "Trebuchet MS", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  #root {
    min-height: 100vh; box-sizing: border-box;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 16px; gap: 10px;
  }
  h1 { margin: 0; font-size: clamp(18px, 3.4vw, 34px); color: #23566b; letter-spacing: 0.06em; text-align: center; }
  p.sub { margin: 0; font-size: clamp(11px, 1.6vw, 15px); color: #5d8698; text-align: center; }
  svg.scene { display: block; width: 100%; max-width: 1000px; height: auto; }
</style>
</head>
<body>
<div id="root">
  <h1>Pelican Riding a Bicycle</h1>
  <p class="sub">A seaside cruise &mdash; wheels, cranks, legs and scarf all in one seamless loop.</p>
<svg class="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A cartoon pelican with a large throat pouch riding a bicycle along a road">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd4f0"/>
      <stop offset="0.65" stop-color="#cdeef9"/>
      <stop offset="1" stop-color="#eef9f4"/>
    </linearGradient>
    <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.55" stop-color="#ffd76e"/>
      <stop offset="1" stop-color="#ffc94d"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecf6e"/>
      <stop offset="1" stop-color="#63b04b"/>
    </linearGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7480"/>
      <stop offset="1" stop-color="#4d565f"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef2"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7b23b"/>
      <stop offset="1" stop-color="#e58e2a"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9a54c"/>
      <stop offset="1" stop-color="#e0733f"/>
    </linearGradient>
    <linearGradient id="scarfG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e05252"/>
      <stop offset="1" stop-color="#c23a3a"/>
    </linearGradient>
  </defs>

  <!-- ======================= BACKGROUND ======================= -->
  <rect x="0" y="0" width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1300" cy="150" r="95" fill="url(#sunG)">
    <animate attributeName="r" values="95;101;95" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <g stroke="#ffd76e" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <line x1="1300" y1="30" x2="1300" y2="55"/>
    <line x1="1300" y1="245" x2="1300" y2="270"/>
    <line x1="1180" y1="150" x2="1205" y2="150"/>
    <line x1="1395" y1="150" x2="1420" y2="150"/>
    <line x1="1215" y1="65" x2="1233" y2="83"/>
    <line x1="1367" y1="217" x2="1385" y2="235"/>
    <line x1="1385" y1="65" x2="1367" y2="83"/>
    <line x1="1233" y1="217" x2="1215" y2="235"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="250" cy="190" rx="95" ry="34"/>
      <ellipse cx="320" cy="170" rx="70" ry="28"/>
      <ellipse cx="185" cy="172" rx="60" ry="24"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 10; 0 0" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </g>
    <g opacity="0.8">
      <ellipse cx="1010" cy="255" rx="80" ry="28"/>
      <ellipse cx="950" cy="238" rx="55" ry="22"/>
      <ellipse cx="1075" cy="240" rx="52" ry="21"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </g>
    <g opacity="0.65">
      <ellipse cx="1490" cy="330" rx="70" ry="24"/>
      <ellipse cx="1540" cy="315" rx="48" ry="19"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 8; 0 0" dur="5.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </g>
  </g>
  <!-- distant hills -->
  <path d="M-50 890 Q200 640 480 890 Z" fill="#b7ddaf"/>
  <path d="M330 890 Q640 660 900 890 Z" fill="#a3d49a"/>
  <path d="M1080 890 Q1330 680 1650 890 Z" fill="#b7ddaf"/>
  <!-- ground -->
  <rect x="0" y="880" width="1600" height="120" fill="url(#grass)"/>
  <rect x="0" y="905" width="1600" height="70" fill="url(#roadG)"/>
  <rect x="0" y="905" width="1600" height="8" fill="#79828c"/>
  <rect x="0" y="967" width="1600" height="8" fill="#79828c"/>
  <line x1="0" y1="940" x2="1600" y2="940" stroke="#f4e46a" stroke-width="7" stroke-dasharray="60 40" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="100;0" dur="0.75s" repeatCount="indefinite"/>
  </line>
  <g stroke="#5c9a49" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M80 895 q 5 -22 -4 -34"/>
    <path d="M120 897 q 8 -18 2 -30"/>
    <path d="M1450 894 q 6 -24 -2 -36"/>
    <path d="M1500 897 q 4 -16 12 -26"/>
  </g>

  <!-- ======================= BICYCLE ======================= -->
  <!-- motion streaks -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.45" fill="none">
    <line x1="250" y1="500" x2="330" y2="500">
      <animate attributeName="opacity" values="0.45;0.05;0.45" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="250;220;250" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="210" y1="620" x2="300" y2="620">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="210;240;210" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="290" y1="740" x2="380" y2="740">
      <animate attributeName="opacity" values="0.5;0.05;0.5" dur="1.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <g stroke="#2e6f9e" stroke-width="13" stroke-linecap="round" fill="none">
    <!-- rear wheel -->
    <g>
      <circle cx="600" cy="760" r="140" fill="none" stroke="#22303c" stroke-width="12"/>
      <g stroke="#7f8b96" stroke-width="4">
        <g>
          <line x1="600" y1="626" x2="600" y2="894"/>
          <line x1="466" y1="760" x2="734" y2="760"/>
          <line x1="506" y1="666" x2="694" y2="854"/>
          <line x1="694" y1="666" x2="506" y2="854"/>
          <line x1="535" y1="639" x2="665" y2="881"/>
          <line x1="688" y1="695" x2="512" y2="825"/>
          <line x1="688" y1="825" x2="512" y2="695"/>
          <animateTransform attributeName="transform" type="rotate" from="0 600 760" to="360 600 760" dur="1.5s" repeatCount="indefinite"/>
        </g>
      </g>
      <circle cx="600" cy="760" r="14" fill="#22303c"/>
      <circle cx="600" cy="760" r="5" fill="#8f9aa5"/>
    </g>
    <!-- front wheel -->
    <g>
      <circle cx="1000" cy="760" r="140" fill="none" stroke="#22303c" stroke-width="12"/>
      <g stroke="#7f8b96" stroke-width="4">
        <g>
          <line x1="1000" y1="626" x2="1000" y2="894"/>
          <line x1="866" y1="760" x2="1134" y2="760"/>
          <line x1="906" y1="666" x2="1094" y2="854"/>
          <line x1="1094" y1="666" x2="906" y2="854"/>
          <line x1="935" y1="639" x2="1065" y2="881"/>
          <line x1="1088" y1="695" x2="912" y2="825"/>
          <line x1="1088" y1="825" x2="912" y2="695"/>
          <animateTransform attributeName="transform" type="rotate" from="0 1000 760" to="360 1000 760" dur="1.5s" repeatCount="indefinite"/>
        </g>
      </g>
      <circle cx="1000" cy="760" r="14" fill="#22303c"/>
      <circle cx="1000" cy="760" r="5" fill="#8f9aa5"/>
    </g>
    <!-- chain -->
    <g stroke="#4a5560" stroke-width="7" fill="none">
      <line x1="606" y1="742" x2="800" y2="736" stroke-dasharray="12 6">
        <animate attributeName="stroke-dashoffset" values="18;0" dur="0.4s" repeatCount="indefinite"/>
      </line>
      <line x1="606" y1="778" x2="800" y2="824" stroke-dasharray="12 6">
        <animate attributeName="stroke-dashoffset" values="18;0" dur="0.4s" repeatCount="indefinite"/>
      </line>
      <circle cx="600" cy="760" r="22" fill="none"/>
    </g>
    <!-- frame triangle -->
    <path d="M800 780 L735 590" stroke-width="14"/>
    <path d="M735 590 L950 640" stroke-width="13"/>
    <path d="M800 780 L950 640" stroke-width="13"/>
    <path d="M735 590 L718 548" stroke-width="10"/>
    <path d="M950 640 L938 535" stroke-width="12"/>
    <path d="M950 640 L1000 760" stroke-width="12"/>
  </g>
  <!-- saddle -->
  <path d="M678 548 Q715 534 752 550 Q716 564 678 548 Z" fill="#3b2b2b" stroke="#241a1a" stroke-width="3"/>
  <!-- handlebar -->
  <g stroke="#2e6f9e" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M938 535 Q940 512 958 508 L986 504"/>
    <path d="M986 504 Q1006 502 1004 518"/>
  </g>
  <circle cx="986" cy="504" r="8" fill="#22303c"/>
  <!-- rear rack / fender hint -->
  <path d="M470 742 Q600 620 730 742" stroke="#5a6570" stroke-width="7" fill="none" opacity="0.6"/>

  <!-- crank + chainring + pedals -->
  <g transform="translate(800 780)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <!-- chainring -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="#3c4650" stroke-width="9"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#3c4650" stroke-width="5"/>
      <g stroke="#3c4650" stroke-width="5">
        <line x1="0" y1="-34" x2="0" y2="34"/>
        <line x1="-30" y1="-17" x2="30" y2="17"/>
        <line x1="-30" y1="17" x2="30" y2="-17"/>
      </g>
      <!-- pedal arms -->
      <line x1="0" y1="0" x2="55" y2="0" stroke="#22303c" stroke-width="12" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-55" y2="0" stroke="#22303c" stroke-width="12" stroke-linecap="round"/>
      <!-- pedal 1 (near leg phase) -->
      <g transform="translate(55 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.5s" repeatCount="indefinite"/>
          <rect x="-26" y="-6" width="52" height="13" rx="5" fill="#22303c"/>
        </g>
      </g>
      <!-- pedal 2 (far leg phase) -->
      <g transform="translate(-55 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.5s" repeatCount="indefinite"/>
          <rect x="-26" y="-6" width="52" height="13" rx="5" fill="#1a222b"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ======================= PELICAN ======================= -->
  <!-- FAR leg (behind body) -->
  <g transform="translate(710 540)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-53;-66.6;-78.8;-78;-65.6;-50.2;-41.9;-43.9;-53"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        dur="1.5s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="170" stroke="#c8742c" stroke-width="24" stroke-linecap="round"/>
      <g transform="translate(0 170)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="89.2;104.9;105.7;90.7;69;50.8;49.8;67;89.2"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            dur="1.5s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="168" stroke="#c8742c" stroke-width="17" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- body + neck + head (bobbing group) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 9; 0 0" keyTimes="0;0.5;1" dur="0.75s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <!-- tail -->
    <path d="M628 452 Q565 420 545 455 Q590 462 610 486 Q600 470 632 470 Z" fill="#dfe6ec" stroke="#c3ced8" stroke-width="3"/>
    <!-- torso -->
    <ellipse cx="700" cy="468" rx="98" ry="80" fill="url(#bodyG)" stroke="#c3ced8" stroke-width="3"/>
    <!-- scarf around neck base -->
    <g>
      <path d="M760 425 Q795 438 830 424 Q800 452 760 440 Z" fill="url(#scarfG)"/>
      <path fill="url(#scarfG)" stroke="#a52f2f" stroke-width="2">
        <animate attributeName="d" dur="1.5s" repeatCount="indefinite"
          values="M768 432 Q700 415 640 428 Q665 452 700 452 Q730 458 762 446 Z;
                  M768 432 Q695 400 628 415 Q655 448 695 448 Q728 460 762 446 Z;
                  M768 432 Q700 415 640 428 Q665 452 700 452 Q730 458 762 446 Z"
          calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      </path>
    </g>
    <!-- neck -->
    <path d="M748 445 C795 435 820 392 832 340" fill="none" stroke="url(#bodyG)" stroke-width="36" stroke-linecap="round"/>
    <path d="M748 445 C795 435 820 392 832 340" fill="none" stroke="#cfd9e1" stroke-width="3" opacity="0.5" transform="translate(14 0)"/>
    <!-- head (nodding) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-3 830 345; 3.5 830 345; -3 830 345" keyTimes="0;0.5;1"
        dur="1.5s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <!-- throat pouch: big drooping bag under the lower mandible -->
      <path d="M852 330 Q905 402 968 336 Q985 330 992 324 Q930 350 852 330 Z" fill="url(#pouchG)" stroke="#c96a35" stroke-width="2.5"/>
      <path d="M852 330 Q910 396 968 336" fill="none" stroke="#d97a40" stroke-width="2" opacity="0.6"/>
      <!-- upper mandible: long with a hooked tip -->
      <path d="M850 316 Q925 300 996 310 Q1008 314 1000 326 Q996 320 988 318 Q920 312 852 322 Z" fill="url(#beakG)" stroke="#cf7f26" stroke-width="2"/>
      <!-- head -->
      <ellipse cx="838" cy="320" rx="42" ry="38" fill="url(#bodyG)" stroke="#c3ced8" stroke-width="3"/>
      <!-- head crest tuft -->
      <path d="M812 292 Q806 268 826 276 Q818 284 824 296 Z" fill="#eef3f6" stroke="#c3ced8" stroke-width="2"/>
      <!-- eye -->
      <circle cx="852" cy="304" r="7" fill="#2b2b2b"/>
      <circle cx="854" cy="301" r="2.6" fill="#ffffff"/>
    </g>
    <!-- wing reaching the handlebar -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-1.5 750 465; 1.5 750 465; -1.5 750 465" keyTimes="0;0.5;1"
        dur="0.75s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <path d="M746 452 C820 458 905 480 982 508 C930 522 845 500 770 480 Q742 466 746 452 Z"
            fill="#eef3f6" stroke="#b9c6d0" stroke-width="3"/>
      <g stroke="#b9c6d0" stroke-width="2.5" fill="none">
        <path d="M800 470 C850 482 915 498 960 512"/>
        <path d="M778 466 C840 480 900 496 945 514"/>
      </g>
      <path d="M960 506 L1000 500 L1004 512 L962 520 Z" fill="#3b4652"/>
    </g>
    <!-- far wing tip on the other grip -->
    <path d="M742 470 C820 494 905 512 976 522 C940 532 850 522 770 498 Z" fill="#d7dfe6" opacity="0.55"/>
  </g>

  <!-- NEAR leg (in front of body) -->
  <g transform="translate(710 540)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-65.6;-50.2;-41.9;-43.9;-53;-66.6;-78.8;-78;-65.6"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        dur="1.5s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="170" stroke="#e8912f" stroke-width="27" stroke-linecap="round"/>
      <g transform="translate(0 170)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="69;50.8;49.8;67;89.2;104.9;105.7;90.7;69"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            dur="1.5s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="168" stroke="#e8912f" stroke-width="19" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- webbed feet riding the pedals -->
  <g transform="translate(800 780)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <g transform="translate(55 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.5s" repeatCount="indefinite"/>
          <path d="M-22 -4 L16 -4 L36 9 L-16 11 Z" fill="#e8912f" stroke="#c8742c" stroke-width="2.5"/>
        </g>
      </g>
      <g transform="translate(-55 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.5s" repeatCount="indefinite"/>
          <path d="M-22 -4 L16 -4 L36 9 L-16 11 Z" fill="#c8742c" stroke="#a55f22" stroke-width="2.5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- title inside the scene -->
  <g>
    <text x="800" y="70" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="46" font-weight="bold" fill="#23566b" opacity="0.9">Pelican Riding a Bicycle</text>
    <text x="800" y="108" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="21" fill="#5d8698">wheels &middot; cranks &middot; pedalling legs &middot; bob &middot; nod &middot; fluttering scarf</text>
  </g>
</svg>
</div>
</body>
</html>
