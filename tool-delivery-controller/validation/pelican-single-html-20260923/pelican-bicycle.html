<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican Riding a Bicycle</title>
<style>
  :root{
    --sky-top:#bfe6ff;
    --sky-bot:#eaf7ff;
    --ground:#8fd07a;
    --road:#c9cfd6;
    --road-line:#f4f7fa;
    --ink:#2b3440;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;}
  body{
    background:#0f1720;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:100vw;
    height:100vh;
    max-width:100%;
    max-height:100%;
    overflow:hidden;
  }
  svg#scene{
    display:block;
    width:100%;
    height:100%;
  }
  /* ---------- 低调标题 ---------- */
  .caption{
    font-size:15px;
    font-weight:600;
    letter-spacing:.14em;
    fill:#31465c;
    opacity:.5;
  }
  .caption-sub{
    font-size:11px;
    letter-spacing:.22em;
    fill:#4a637d;
    opacity:.42;
  }
  /* ---------- 播放/暂停按钮 ---------- */
  #playBtn{
    position:absolute;
    right:14px;
    bottom:14px;
    z-index:5;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    font:600 12px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    letter-spacing:.08em;
    color:#e8f4ff;
    background:rgba(24,40,56,.55);
    border:1px solid rgba(220,240,255,.32);
    border-radius:999px;
    cursor:pointer;
    backdrop-filter:blur(4px);
    transition:background .2s ease,border-color .2s ease,transform .15s ease;
  }
  #playBtn:hover{background:rgba(30,52,74,.75);border-color:rgba(230,245,255,.55);}
  #playBtn:active{transform:scale(.96);}
  #playBtn .dot{
    width:8px;height:8px;border-radius:50%;
    background:#7ee08a;
    box-shadow:0 0 8px rgba(126,224,138,.9);
  }
  #playBtn[data-state="paused"] .dot{background:#ffd166;box-shadow:0 0 8px rgba(255,209,102,.9);}
  /* ---------- 动画基础 ---------- */
  .anim{animation-duration:2s;animation-iteration-count:infinite;animation-timing-function:linear;}
  .paused *{animation-play-state:paused !important;}
  @keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-3.2px);}
  }
  @keyframes bobHead{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-2px) rotate(-1.4deg);}
  }
  @keyframes cloudDrift{
    from{transform:translateX(0);}
    to{transform:translateX(-320px);}
  }
  @keyframes roadScroll{
    from{transform:translateX(0);}
    to{transform:translateX(-180px);}
  }
  @keyframes hillScroll{
    from{transform:translateX(0);}
    to{transform:translateX(-400px);}
  }
  @keyframes speedLine{
    0%{transform:translateX(70px);opacity:0;}
    25%{opacity:.55;}
    100%{transform:translateX(-240px);opacity:0;}
  }
  @keyframes legL{
    0%{transform:rotate(24deg);}
    50%{transform:rotate(-24deg);}
    100%{transform:rotate(24deg);}
  }
  @keyframes legR{
    0%{transform:rotate(-24deg);}
    50%{transform:rotate(24deg);}
    100%{transform:rotate(-24deg);}
  }
  /* 车轮：定位组与旋转组分离 */
  .wheelSpin{animation-name:spin;transform-origin:0 0;}
  .crankSpin{animation-name:spin;animation-duration:1s;transform-origin:0 0;}
  .cloudDrift{animation-name:cloudDrift;animation-duration:16s;}
  .cloudDrift.slow{animation-duration:24s;}
  .cloudDrift.fast{animation-duration:11s;}
  .roadScroll{animation-name:roadScroll;animation-duration:1.2s;}
  .hillScroll{animation-name:hillScroll;animation-duration:26s;}
  .pelicanBob{animation-name:bob;animation-duration:1s;}
  .headBob{animation-name:bobHead;animation-duration:1s;transform-origin:0 0;}
  .legL{animation-name:legL;animation-duration:1s;transform-origin:0 0;}
  .legR{animation-name:legR;animation-duration:1s;transform-origin:0 0;}
  .speedLine{animation-name:speedLine;animation-duration:1.1s;animation-iteration-count:infinite;animation-timing-function:ease-out;}
  .speedLine.s2{animation-duration:1.35s;animation-delay:.28s;}
  .speedLine.s3{animation-duration:.95s;animation-delay:.55s;}
  .speedLine.s4{animation-duration:1.5s;animation-delay:.8s;}
  @media (prefers-reduced-motion: reduce){
    .anim,.wheelSpin,.crankSpin,.cloudDrift,.roadScroll,.hillScroll,.pelicanBob,.headBob,.legL,.legR,.speedLine{
      animation-duration:6s;
    }
  }
</style>
</head>
<body>
<div id="stage">
<svg id="scene" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="一只鹈鹕骑着自行车向前行进">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9dcff"/>
      <stop offset="55%" stop-color="#cfeaff"/>
      <stop offset="100%" stop-color="#eef8ff"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9bd97f"/>
      <stop offset="100%" stop-color="#6fbd5c"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfe4ea"/>
      <stop offset="100%" stop-color="#bcc4cd"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f2f5f8"/>
      <stop offset="100%" stop-color="#dde4ea"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc247"/>
      <stop offset="100%" stop-color="#f79a1e"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="100%" stop-color="#f0a53a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d0" stop-opacity=".95"/>
      <stop offset="60%" stop-color="#ffe9a8" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wheelShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6774"/>
      <stop offset="100%" stop-color="#39434e"/>
    </linearGradient>
  </defs>

  <!-- ================= 天空 ================= -->
  <rect x="0" y="0" width="800" height="500" fill="url(#skyGrad)"/>
  <circle cx="655" cy="92" r="86" fill="url(#sunGlow)"/>
  <circle cx="655" cy="92" r="38" fill="#fff2c2" opacity=".95"/>

  <!-- 远景山丘：400px 图块重复，恰好平移一个图块宽度 -->
  <g clip-path="url(#sceneClip)">
    <clipPath id="sceneClip"><rect x="0" y="0" width="800" height="500"/></clipPath>
    <g class="hillScroll">
      <g id="hillTile">
        <g opacity=".55">
          <path d="M0 330 L100 250 L200 330 Z" fill="#8fbfa8"/>
          <path d="M200 330 L300 238 L400 330 Z" fill="#7db39b"/>
        </g>
        <g opacity=".42" fill="#6ea88f">
          <path d="M0 330 L80 285 L160 330 Z"/>
          <path d="M180 330 L285 276 L390 330 Z"/>
        </g>
      </g>
      <use href="#hillTile" x="-400"/>
      <use href="#hillTile" x="400"/>
      <use href="#hillTile" x="800"/>
      <use href="#hillTile" x="1200"/>
    </g>
  </g>

  <!-- 云层：每层都由 320px 图块平铺，循环边界保持连续 -->
  <g clip-path="url(#sceneClip)">
    <g class="cloudDrift slow" opacity=".9" fill="#ffffff">
      <g id="slowCloudTile">
        <ellipse cx="112" cy="86" rx="46" ry="20"/>
        <ellipse cx="144" cy="74" rx="32" ry="22"/>
        <ellipse cx="80" cy="76" rx="26" ry="16"/>
        <ellipse cx="260" cy="118" rx="40" ry="17"/>
        <ellipse cx="286" cy="106" rx="28" ry="19"/>
      </g>
      <use href="#slowCloudTile" x="-320"/>
      <use href="#slowCloudTile" x="320"/>
      <use href="#slowCloudTile" x="640"/>
      <use href="#slowCloudTile" x="960"/>
    </g>
    <g class="cloudDrift fast" opacity=".62" fill="#ffffff">
      <g id="fastCloudTile">
        <ellipse cx="72" cy="150" rx="30" ry="13"/>
        <ellipse cx="94" cy="142" rx="20" ry="14"/>
        <ellipse cx="248" cy="168" rx="34" ry="14"/>
        <ellipse cx="274" cy="158" rx="22" ry="15"/>
      </g>
      <use href="#fastCloudTile" x="-320"/>
      <use href="#fastCloudTile" x="320"/>
      <use href="#fastCloudTile" x="640"/>
      <use href="#fastCloudTile" x="960"/>
    </g>
  </g>

  <!-- ================= 地面 ================= -->
  <rect x="0" y="352" width="800" height="148" fill="url(#groundGrad)"/>
  <rect x="0" y="352" width="800" height="10" fill="#7ec96a" opacity=".7"/>

  <!-- 树丛：与 400px 平移距离一致的重复图块 -->
  <g clip-path="url(#sceneClip)">
    <g class="hillScroll" style="animation-duration:18s;" fill="#4f9a55" opacity=".85">
      <g id="treeTile">
        <circle cx="80" cy="352" r="22"/><circle cx="110" cy="346" r="16"/>
        <circle cx="280" cy="352" r="26"/><circle cx="314" cy="344" r="18"/>
      </g>
      <use href="#treeTile" x="-400"/>
      <use href="#treeTile" x="400"/>
      <use href="#treeTile" x="800"/>
      <use href="#treeTile" x="1200"/>
    </g>
  </g>

  <!-- ================= 道路（横向滚动条带，图块 180，两组无缝） ================= -->
  <rect x="0" y="404" width="800" height="96" fill="url(#roadGrad)"/>
  <rect x="0" y="404" width="800" height="4" fill="#aeb8c2"/>
  <g clip-path="url(#sceneClip)">
    <g class="roadScroll">
      <g fill="#f7fafc" opacity=".85">
        <rect x="10" y="452" width="60" height="5" rx="2.5"/>
        <rect x="190" y="452" width="60" height="5" rx="2.5"/>
        <rect x="370" y="452" width="60" height="5" rx="2.5"/>
        <rect x="550" y="452" width="60" height="5" rx="2.5"/>
        <rect x="730" y="452" width="60" height="5" rx="2.5"/>
      </g>
      <g fill="#f7fafc" opacity=".85" transform="translate(180,0)">
        <rect x="10" y="452" width="60" height="5" rx="2.5"/>
        <rect x="190" y="452" width="60" height="5" rx="2.5"/>
        <rect x="370" y="452" width="60" height="5" rx="2.5"/>
        <rect x="550" y="452" width="60" height="5" rx="2.5"/>
        <rect x="730" y="452" width="60" height="5" rx="2.5"/>
      </g>
    </g>
  </g>
  <rect x="0" y="480" width="800" height="20" fill="#a3adb8" opacity=".45"/>

  <!-- ================= 主组：鹈鹕 + 自行车 ================= -->
  <g id="rig">

    <!-- 速度线 -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".75" fill="none">
      <line class="speedLine" x1="300" y1="262" x2="372" y2="262"/>
      <line class="speedLine s2" x1="316" y1="300" x2="392" y2="300"/>
      <line class="speedLine s3" x1="292" y1="336" x2="352" y2="336"/>
      <line class="speedLine s4" x1="322" y1="222" x2="386" y2="222"/>
    </g>

    <!-- 自行车地面阴影 -->
    <ellipse cx="400" cy="452" rx="150" ry="13" fill="#3c5a3f" opacity=".22"/>

    <!-- ---------- 后轮 ---------- -->
    <g transform="translate(283,406)">
      <circle r="60" fill="none" stroke="url(#wheelShade)" stroke-width="7"/>
      <circle r="60" fill="none" stroke="#20262e" stroke-width="2" opacity=".35"/>
      <g class="wheelSpin">
        <g stroke="#8b98a6" stroke-width="2" opacity=".95">
          <line x1="-54" y1="0" x2="54" y2="0"/>
          <line x1="0" y1="-54" x2="0" y2="54"/>
          <line x1="-38" y1="-38" x2="38" y2="38"/>
          <line x1="-38" y1="38" x2="38" y2="-38"/>
          <line x1="-50" y1="-20" x2="50" y2="20"/>
          <line x1="-50" y1="20" x2="50" y2="-20"/>
          <line x1="-20" y1="-50" x2="20" y2="50"/>
          <line x1="-20" y1="50" x2="20" y2="-50"/>
        </g>
        <circle r="5" fill="#c3ccd6"/>
      </g>
      <circle r="7" fill="#6f7c8a" stroke="#39434e" stroke-width="2"/>
      <circle r="53" fill="none" stroke="#ffffff" stroke-width="1.5" opacity=".5"/>
    </g>

    <!-- ---------- 前轮 ---------- -->
    <g transform="translate(533,406)">
      <circle r="60" fill="none" stroke="url(#wheelShade)" stroke-width="7"/>
      <circle r="60" fill="none" stroke="#20262e" stroke-width="2" opacity=".35"/>
      <g class="wheelSpin" style="animation-delay:-.35s;">
        <g stroke="#8b98a6" stroke-width="2" opacity=".95">
          <line x1="-54" y1="0" x2="54" y2="0"/>
          <line x1="0" y1="-54" x2="0" y2="54"/>
          <line x1="-38" y1="-38" x2="38" y2="38"/>
          <line x1="-38" y1="38" x2="38" y2="-38"/>
          <line x1="-50" y1="-20" x2="50" y2="20"/>
          <line x1="-50" y1="20" x2="50" y2="-20"/>
          <line x1="-20" y1="-50" x2="20" y2="50"/>
          <line x1="-20" y1="50" x2="20" y2="-50"/>
        </g>
        <circle r="5" fill="#c3ccd6"/>
      </g>
      <circle r="7" fill="#6f7c8a" stroke="#39434e" stroke-width="2"/>
      <circle r="53" fill="none" stroke="#ffffff" stroke-width="1.5" opacity=".5"/>
    </g>

    <!-- ---------- 车架 ---------- -->
    <g stroke="#e5484d" stroke-width="8" stroke-linecap="round" fill="none">
      <!-- 主三角：后轴 - 五通 - 座管顶 -->
      <line x1="283" y1="406" x2="400" y2="406"/>
      <line x1="283" y1="406" x2="392" y2="322"/>
      <line x1="392" y1="322" x2="400" y2="406"/>
      <!-- 上管：座管顶 - 头管 -->
      <line x1="392" y1="322" x2="503" y2="316"/>
      <!-- 下管：五通 - 头管 -->
      <line x1="400" y1="406" x2="503" y2="316"/>
      <!-- 前叉 -->
      <line x1="503" y1="316" x2="533" y2="406"/>
      <line x1="400" y1="406" x2="410" y2="398" stroke-width="5"/>
    </g>
    <g stroke="#b8323a" stroke-width="2" opacity=".55" fill="none">
      <line x1="283" y1="406" x2="400" y2="406"/>
      <line x1="392" y1="322" x2="400" y2="406"/>
      <line x1="400" y1="406" x2="503" y2="316"/>
    </g>

    <!-- 座管与车座 -->
    <line x1="392" y1="322" x2="386" y2="292" stroke="#c9ced6" stroke-width="7" stroke-linecap="round"/>
    <path d="M362 288 q22 -13 48 -3 q-4 11 -22 12 q-20 1 -26 -9 z" fill="#2f3742"/>
    <path d="M366 286 q20 -10 42 -2" fill="none" stroke="#5b6675" stroke-width="2" opacity=".8"/>

    <!-- 车把（头管顶部） -->
    <line x1="503" y1="316" x2="508" y2="288" stroke="#c9ced6" stroke-width="7" stroke-linecap="round"/>
    <path d="M508 288 q-4 -16 -26 -14" fill="none" stroke="#39434e" stroke-width="7" stroke-linecap="round"/>
    <path d="M508 288 q16 -14 26 -4" fill="none" stroke="#39434e" stroke-width="7" stroke-linecap="round"/>
    <circle cx="484" cy="274" r="5" fill="#20262e"/>
    <circle cx="534" cy="284" r="5" fill="#20262e"/>
    <!-- 车铃 -->
    <circle cx="512" cy="292" r="6" fill="#ffd166" stroke="#c99a2e" stroke-width="2"/>

    <!-- 链条（虚线，与曲柄同周期微动） -->
    <g stroke="#4a5563" stroke-width="3" fill="none" opacity=".95">
      <line x1="283" y1="399" x2="400" y2="399" stroke-dasharray="7 5">
        <animate attributeName="stroke-dashoffset" values="0;-48" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="283" y1="413" x2="400" y2="413" stroke-dasharray="7 5">
        <animate attributeName="stroke-dashoffset" values="0;-48" dur="1s" repeatCount="indefinite"/>
      </line>
    </g>
    <circle cx="283" cy="406" r="11" fill="none" stroke="#4a5563" stroke-width="3"/>
    <circle cx="400" cy="406" r="20" fill="none" stroke="#4a5563" stroke-width="3"/>
    <circle cx="400" cy="406" r="13" fill="none" stroke="#6f7c8a" stroke-width="2" opacity=".8"/>

    <!-- ---------- 曲柄 + 踏板（绕五通旋转） ---------- -->
    <g transform="translate(400,406)">
      <g class="crankSpin">
        <line x1="0" y1="0" x2="0" y2="-26" stroke="#2f3742" stroke-width="7" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="0" y2="26" stroke="#2f3742" stroke-width="7" stroke-linecap="round"/>
        <rect x="-13" y="-34" width="26" height="9" rx="3" fill="#39434e"/>
        <rect x="-13" y="25" width="26" height="9" rx="3" fill="#39434e"/>
        <circle r="6" fill="#c9ced6" stroke="#39434e" stroke-width="2"/>
      </g>
    </g>

    <!-- ---------- 鹈鹕（身体随踩踏轻微起伏） ---------- -->
    <g class="pelicanBob">

      <!-- 腿（与曲柄同周期，相位相反） -->
      <g transform="translate(392,330)">
        <g class="legL" style="animation-delay:0s;">
          <line x1="0" y1="0" x2="-4" y2="30" stroke="#f0a53a" stroke-width="8" stroke-linecap="round"/>
          <line x1="-4" y1="30" x2="-6" y2="56" stroke="#f0a53a" stroke-width="7" stroke-linecap="round"/>
          <path d="M-6 56 q-13 8 -22 3 q9 -12 22 -9 z" fill="#f79a1e"/>
          <path d="M-6 56 q2 11 -3 17 q-11 -6 -8 -18 z" fill="#ffb733"/>
        </g>
      </g>
      <g transform="translate(400,330)">
        <g class="legR" style="animation-delay:0s;">
          <line x1="0" y1="0" x2="4" y2="30" stroke="#e08f22" stroke-width="8" stroke-linecap="round"/>
          <line x1="4" y1="30" x2="6" y2="56" stroke="#e08f22" stroke-width="7" stroke-linecap="round"/>
          <path d="M6 56 q13 8 22 3 q-9 -12 -22 -9 z" fill="#e08f22"/>
          <path d="M6 56 q-2 11 3 17 q11 -6 8 -18 z" fill="#f0a53a"/>
        </g>
      </g>

      <!-- 尾羽 -->
      <path d="M300 250 q-42 -6 -62 -26 q30 -4 48 4 q-24 -16 -40 -34 q34 6 52 26 z" fill="#dde4ea" stroke="#c2ccd6" stroke-width="2"/>

      <!-- 身体 -->
      <ellipse cx="352" cy="262" rx="72" ry="56" fill="url(#bodyGrad)" stroke="#c8d2db" stroke-width="2.5"/>
      <!-- 腹部阴影 -->
      <path d="M296 288 q56 34 112 -6 q-10 44 -58 48 q-44 2 -54 -42 z" fill="#dfe6ec" opacity=".85"/>

      <!-- 翅膀 -->
      <path d="M340 232 q56 -14 88 22 q-30 40 -84 34 q-30 -6 -34 -28 q-3 -20 30 -28 z" fill="#c3ccd6" stroke="#a7b3c0" stroke-width="2.5"/>
      <path d="M348 252 q40 -12 72 12" fill="none" stroke="#a7b3c0" stroke-width="2.5" opacity=".85"/>
      <path d="M342 268 q42 -8 74 12" fill="none" stroke="#a7b3c0" stroke-width="2.5" opacity=".7"/>
      <path d="M336 284 q40 -4 68 10" fill="none" stroke="#a7b3c0" stroke-width="2.5" opacity=".55"/>
      <!-- 翅尖羽 -->
      <path d="M424 258 q22 6 30 20 q-20 8 -34 -2 z" fill="#aab6c3" stroke="#93a1af" stroke-width="2"/>

      <!-- 颈部 -->
      <path d="M368 232 q14 -34 40 -44 q22 -8 32 8 q-24 10 -34 34 q-8 20 -12 30 q-16 -6 -26 -28 z" fill="url(#bodyGrad)" stroke="#c8d2db" stroke-width="2.5"/>

      <!-- 头部 + 长喙 -->
      <g transform="translate(432,180)">
        <g class="headBob">
          <!-- 后脑 -->
          <ellipse cx="0" cy="0" rx="30" ry="27" fill="url(#bodyGrad)" stroke="#c8d2db" stroke-width="2.5"/>
          <!-- 头顶羽冠 -->
          <path d="M-18 -22 q6 -18 22 -18 q-10 8 -8 18 z" fill="#e6ecf1" stroke="#c8d2db" stroke-width="2"/>
          <!-- 长喙上颌 -->
          <path d="M20 -10 q62 -8 96 4 q10 4 6 10 q-4 6 -14 4 q-38 -8 -88 2 q-6 -12 0 -20 z" fill="url(#beakGrad)" stroke="#e08f22" stroke-width="2"/>
          <!-- 喉囊 -->
          <path d="M22 6 q10 40 44 44 q34 4 50 -28 q-30 14 -62 2 q-22 -8 -32 -18 z" fill="url(#pouchGrad)" stroke="#e08f22" stroke-width="2"/>
          <path d="M30 14 q14 30 42 32 q24 2 38 -20" fill="none" stroke="#f7c25e" stroke-width="2" opacity=".8"/>
          <!-- 喙尖 -->
          <path d="M114 -2 q14 2 16 8 q-2 6 -16 4 q-4 -6 0 -12 z" fill="#f79a1e"/>
          <!-- 眼睛 -->
          <circle cx="6" cy="-6" r="7.5" fill="#2b3440"/>
          <circle cx="8.5" cy="-8.5" r="2.6" fill="#ffffff" opacity=".95"/>
          <circle cx="6" cy="-6" r="9.5" fill="none" stroke="#c8d2db" stroke-width="1.6"/>
          <!-- 脸颊 -->
          <path d="M-16 6 q10 10 24 6" fill="none" stroke="#d5dde4" stroke-width="2.2"/>
        </g>
      </g>

      <!-- 翅膀搭在车把上的"手"（翼尖勾住车把） -->
      <path d="M424 268 q34 6 54 8 q10 2 8 10 q-3 8 -14 6 q-26 -6 -50 -10 z" fill="#b8c3cf" stroke="#9fabb8" stroke-width="2"/>
    </g>

    <!-- 鹈鹕脖子与车座的接触阴影 -->
    <ellipse cx="384" cy="292" rx="30" ry="8" fill="#3c5a3f" opacity=".12"/>
  </g>

  <!-- ================= 低调标题 ================= -->
  <text class="caption" x="400" y="44" text-anchor="middle">PELICAN ON A BICYCLE</text>
  <text class="caption-sub" x="400" y="66" text-anchor="middle">鹈鹕骑自行车 · 2D VECTOR LOOP</text>
</svg>

<button id="playBtn" type="button" data-state="playing" aria-label="暂停动画">
  <span class="dot" aria-hidden="true"></span><span id="playLabel">暂停</span>
</button>
</div>

<script>
(function () {
  "use strict";

  var scene = document.getElementById("scene");
  var btn = document.getElementById("playBtn");
  var label = document.getElementById("playLabel");
  if (!scene || !btn || !label) { return; }

  var paused = false;

  // 收集所有带 CSS 动画的元素，用于兜底暂停（部分环境 animation-play-state 支持差异）
  var animated = Array.prototype.slice.call(scene.querySelectorAll(".anim, .wheelSpin, .crankSpin, .cloudDrift, .roadScroll, .hillScroll, .pelicanBob, .headBob, .legL, .legR, .speedLine"));

  function setPaused(next) {
    paused = next;
    scene.classList.toggle("paused", paused);
    btn.setAttribute("data-state", paused ? "paused" : "playing");
    btn.setAttribute("aria-label", paused ? "播放动画" : "暂停动画");
    label.textContent = paused ? "播放" : "暂停";

    for (var i = 0; i < animated.length; i++) {
      var el = animated[i];
      el.style.animationPlayState = paused ? "paused" : "running";
    }

    // SVG SMIL（链条虚线）同步暂停/恢复
    var smil = scene.querySelectorAll("animate");
    for (var j = 0; j < smil.length; j++) {
      try {
        if (paused) { smil[j].pauseAnimations ? null : null; }
      } catch (e) { /* 忽略 */ }
    }
    try {
      if (typeof scene.pauseAnimations === "function") {
        if (paused) { scene.pauseAnimations(); } else { scene.unpauseAnimations(); }
      }
    } catch (e) { /* 忽略不支持的环境 */ }
  }

  btn.addEventListener("click", function () {
    setPaused(!paused);
  });

  // 键盘可达性：空格/回车（按钮默认支持，此处避免滚动）
  btn.addEventListener("keydown", function (ev) {
    if (ev.key === " " || ev.key === "Spacebar") { ev.preventDefault(); }
  });

  // 页面不可见时暂停以省电，回到前台按用户选择恢复
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      scene.classList.add("paused");
    } else {
      scene.classList.toggle("paused", paused);
    }
  });

  // 初始状态：自动播放
  setPaused(false);
})();
</script>
</body>
