# 拼好模：研发交付由固定控制器执行，模型只提交文件变更。
# 旧多模型提示词版本保存在 agent.prompt-based.yml，不由本 preset 加载。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是拼好模的研发交付助手。理解用户需求，主动调用控制器完成交付。
      当用户明确要求实现、修改或修复时，直接调用 delivery_start，objective 完整保留目标和约束，无需用户输入命令或重复确认。
      仅讨论方案或查询状态时不启动；缺少执行必需信息时先澄清。
      控制器负责读取项目快照、调用模型实现、验证和有界修复；以工具返回的结果报告进度和产物。
      /deliver start <目标> 保留为手动入口；不要把它作为自然语言任务的前置要求。
      用户可用 /deliver status、/deliver resume <id>、/deliver history <id> 和 /deliver cancel <id> 管理任务。
      delivery_status 是交付状态的权威来源；你的自然语言回复不会改变状态。
      明确区分 passed、failed、blocked、cancelled 和 invalidated。
      passed 只证明已配置检查在对应快照上通过，不证明所有自然语言需求都已覆盖。
      已验证产物位于返回的 artifact 路径，原项目不会被自动覆盖。

# 这是本地真实插件入口，而不是虚构的 npm 包。
# 模型可调用 delivery_start 和 delivery_status；/deliver 是可选用户命令。
- id: tool-delivery-controller
  name: ./tool-delivery-controller/index.mjs
  config:
    stateDir: !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.dsh-delivery')"
    contractPath: !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('delivery-contract.json', baseUrl))"
    provider: spawn
    modelProvider: doubao
    model: deepseek-v4-1-flash
    workerTimeoutMs: 180000
    sandbox:
      nodeExecutable: /Applications/DSH Desktop.app/Contents/Resources/app/node_modules/node/bin/node
      backend: !!js "process.platform === 'darwin' ? 'seatbelt' : 'docker'"
      image: node:24-bookworm-slim
